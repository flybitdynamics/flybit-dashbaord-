<!doctype html><meta charset="utf-8"><title>cmp</title><body style="background:#888;margin:0">
<div id="out" style="display:flex;gap:6px;align-items:flex-start"></div>
<script type="module">
import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.mjs";
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.mjs";
const out = document.getElementById("out");
for (const url of ["/_mine.pdf", "/_orig.pdf"]) {
  const col = document.createElement("div");
  out.appendChild(col);
  const pdf = await pdfjsLib.getDocument(url).promise;
  for (let n = 1; n <= pdf.numPages; n++) {
    const page = await pdf.getPage(n);
    const vp = page.getViewport({ scale: 0.42 });
    const c = document.createElement("canvas");
    c.width = vp.width; c.height = vp.height; c.style.cssText = "display:block;background:#fff;margin-bottom:4px";
    col.appendChild(c);
    await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
  }
}
window.__drawn = true;
</script>
